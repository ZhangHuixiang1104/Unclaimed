<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">六十八公斤，怎样带过去</title>
  <desc id="desc">手摇发电机的报道重量为68公斤。三种无具体人物面容的携行符号分别表示抬、背、拖；这是后制信息示意，不是文物照片或器物外形复原。</desc>
  <defs><style>.sans{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.serif{font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif}.meta{font:600 15px ui-monospace,Consolas,monospace;letter-spacing:2px;fill:#8d4f3e}.body{font-size:19px;fill:#4b554b}.num{font:700 176px Georgia,"Times New Roman",serif;fill:#9d5341}.label{font-size:26px;font-weight:700;fill:#203027}</style></defs>
  <rect width="1200" height="700" fill="#e9e1cf"/><rect x="40" y="40" width="1120" height="620" fill="none" stroke="#aca38e"/>
  <text x="86" y="93" class="meta">H03 / CARRYING THE GENERATOR</text>
  <text x="86" y="163" class="serif" font-size="49" font-weight="700" fill="#1b2720">68公斤，怎样带过去</text>
  <text x="88" y="207" class="sans body">这个重量说的是手摇发电机，不是故事里的电池盒。</text>
  <text x="100" y="424" class="num">68</text><text x="330" y="414" class="serif" font-size="43" fill="#9d5341">公斤</text>
  <path d="M90 447H440" stroke="#a9a08f" stroke-width="2"/>
  <text x="100" y="482" class="sans body">公开报道所记手摇发电机重量</text>
  <g class="sans" text-anchor="middle" fill="none" stroke="#4a5a4b" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(604 334)"><path d="M-55-50v62m110-62v62M-55-32h110" stroke-width="5"/><circle cx="-55" cy="-69" r="16" stroke-width="4"/><circle cx="55" cy="-69" r="16" stroke-width="4"/><rect x="-27" y="-16" width="54" height="43" fill="#d3c3a4" stroke-width="3"/><text y="110" class="label" stroke="none">抬</text></g>
    <g transform="translate(831 334)"><circle cx="-7" cy="-67" r="16" stroke-width="4"/><path d="M-9-50v67l-32 31m32-31 32 31m-33-65-34 24" stroke-width="5"/><rect x="6" y="-31" width="49" height="59" fill="#d3c3a4" stroke-width="3"/><text y="110" class="label" stroke="none">背</text></g>
    <g transform="translate(1040 334)"><circle cx="-45" cy="-67" r="16" stroke-width="4"/><path d="M-45-50v58l-28 42m28-42 25 44m-24-77 57 27" stroke-width="5"/><path d="M15-1h41l18 44H23Z" fill="#d3c3a4" stroke-width="3"/><path d="M-9 53h89" stroke-width="3"/><text y="110" class="label" stroke="none">拖</text></g>
  </g>
  <rect x="86" y="554" width="1028" height="74" fill="#f3ecdf" stroke="#c7bba7"/>
  <text x="105" y="585" class="sans" font-size="18" fill="#263329">据报道，谢宝金和战友一路守护发电机，越雪山、过草地。</text>
  <text x="105" y="610" class="sans" font-size="14" fill="#737869">携行方式为报道概括；图形不是当年的现场或器物复原。 · 据公开报道编绘／示意</text>
</svg>
