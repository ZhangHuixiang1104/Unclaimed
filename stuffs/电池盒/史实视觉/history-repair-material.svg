<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">坏了，还能修</title>
  <desc id="desc">旧零件、维修、继续使用的三个阶段。红四方面军蔡威利用废铅重做旧电瓶铅板，是公开报道记载的另一部队事例，不能认作游戏盒的真实履历。</desc>
  <defs><style>.sans{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.serif{font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif}.meta{font:600 15px ui-monospace,Consolas,monospace;letter-spacing:2px;fill:#8d4f3e}.body{font-size:19px;fill:#4b554b}.head{font-size:28px;font-weight:700;fill:#203027}</style></defs>
  <rect width="1200" height="700" fill="#e9e1cf"/><rect x="40" y="40" width="1120" height="620" fill="none" stroke="#aca38e"/>
  <text x="86" y="93" class="meta">H02 / REPAIR &amp; REUSE</text>
  <text x="86" y="163" class="serif" font-size="49" font-weight="700" fill="#1b2720">坏了，还能修</text>
  <text x="88" y="207" class="sans body">器材紧缺时，修理让有限的零件多一次可用机会。</text>
  <g class="sans" text-anchor="middle">
    <rect x="82" y="274" width="294" height="240" fill="#f4ecdd" stroke="#c4b9a3"/>
    <rect x="453" y="274" width="294" height="240" fill="#f4ecdd" stroke="#c4b9a3"/>
    <rect x="824" y="274" width="294" height="240" fill="#f4ecdd" stroke="#c4b9a3"/>
    <path d="M185 355h80v46h-80z" fill="#b4a98d" stroke="#616b5b" stroke-width="3"/><path d="M205 344v-16M245 344v-16" stroke="#8d4f3e" stroke-width="8" stroke-linecap="round"/>
    <path d="M559 398l59-59M578 343l40 40M552 406l18 18" stroke="#8d4f3e" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M922 393h95v-51h-95z" fill="#d0bb93" stroke="#435b49" stroke-width="3"/><path d="M938 334v-13M1000 334v-13" stroke="#8d4f3e" stroke-width="8" stroke-linecap="round"/><path d="m955 368 13 12 21-24" fill="none" stroke="#435b49" stroke-width="7" stroke-linecap="round"/>
    <text x="229" y="460" class="head">旧零件</text><text x="600" y="460" class="head">维修</text><text x="971" y="460" class="head">继续使用</text>
  </g>
  <path d="M390 391h46m-13-12 13 12-13 12M761 391h46m-13-12 13 12-13 12" fill="none" stroke="#9e6b4b" stroke-width="3" stroke-linecap="round"/>
  <rect x="86" y="552" width="1028" height="76" fill="#f3ecdf" stroke="#c7bba7"/>
  <text x="105" y="581" class="sans" font-size="17" fill="#263329">公开报道中的一例：蔡威利用废铅重做旧电瓶铅板。</text>
  <text x="105" y="608" class="sans" font-size="15" fill="#737869">红四方面军的维修事迹；并非游戏盒或谢宝金所携发电机的履历。 · 据公开报道编绘／示意</text>
</svg>
